<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>origin_master</title>
<style>
  html, body{
    height:100%;
    margin:0;
    background:#fff;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  svg{ width:100vw; height:100svh; display:block; }
  .ui{
    position:fixed;
    left:10px; top:10px;
    display:flex; gap:8px;
    font:14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    z-index:10;
  }
  .btn{
    padding:8px 10px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fff;
  }
</style>
</head>
<body>

<div class="ui">
  <button class="btn" id="undoBtn">Undo</button>
  <button class="btn" id="clearBtn">Clear</button>
</div>

<svg id="svg" xmlns="http://www.w3.org/2000/svg"
     viewBox="-200 -200 400 400" preserveAspectRatio="xMidYMid meet">

  <defs>
    <!-- Small grid: 10 units per square -->
    <pattern id="gridSmall" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 H 0 V 10" fill="none" stroke="#d7d7d7" stroke-width="0.9"/>
    </pattern>

    <!-- Major grid: every 5 squares (50 units) -->
    <pattern id="gridBig" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 H 0 V 50" fill="none" stroke="#f2b7b7" stroke-width="0.6"/>
    </pattern>

    <!-- A reusable "circle+rays" symbol (centered at 0,0) -->
    <g id="circleRig">
      <!-- Decagon rays (10 rays, 36° steps) -->
      <g id="rays" stroke="#c2c2c2" stroke-width="0.6" opacity="0.85">
        <!-- generated by JS too if you want, but hard-coded is simpler -->
        <!-- 0° -->
        <line x1="0" y1="0" x2="210" y2="0"/>
        <!-- 36° -->
        <line x1="0" y1="0" x2="169.740" y2="123.434"/>
        <!-- 72° -->
        <line x1="0" y1="0" x2="64.893" y2="199.657"/>
        <!-- 108° -->
        <line x1="0" y1="0" x2="-64.893" y2="199.657"/>
        <!-- 144° -->
        <line x1="0" y1="0" x2="-169.740" y2="123.434"/>
        <!-- 180° -->
        <line x1="0" y1="0" x2="-210" y2="0"/>
        <!-- 216° -->
        <line x1="0" y1="0" x2="-169.740" y2="-123.434"/>
        <!-- 252° -->
        <line x1="0" y1="0" x2="-64.893" y2="-199.657"/>
        <!-- 288° -->
        <line x1="0" y1="0" x2="64.893" y2="-199.657"/>
        <!-- 324° -->
        <line x1="0" y1="0" x2="169.740" y2="-123.434"/>
      </g>

      <!-- Circles (light grey strokes) -->
      <g fill="none" stroke="#bdbdbd" stroke-width="0.7" opacity="0.95">
        <circle cx="0" cy="0" r="10"/>
        <circle cx="0" cy="0" r="20"/>
        <circle cx="0" cy="0" r="30"/>
        <circle cx="0" cy="0" r="50"/>
        <circle cx="0" cy="0" r="80"/>
        <circle cx="0" cy="0" r="130"/>
        <!-- biggest circle invisible -->
        <circle cx="0" cy="0" r="210" stroke-opacity="0"/>
      </g>

      <!-- true intersection marker -->
      <circle cx="0" cy="0" r="1.5" fill="#111" opacity="0.9"/>
    </g>
  </defs>

  <!-- Infinite background -->
  <rect x="-100000" y="-100000" width="200000" height="200000" fill="#fff"/>
  <rect x="-100000" y="-100000" width="200000" height="200000" fill="url(#gridSmall)"/>
  <rect x="-100000" y="-100000" width="200000" height="200000" fill="url(#gridBig)"/>

  <!-- Subtle sacred landing dots (29 total) -->
  <g id="landingDots" fill="#111" opacity="0.22"></g>

  <!-- Stamped copies live here -->
  <g id="stamps"></g>

  <!-- Active draggable rig -->
  <g id="active" transform="translate(0 0)">
    <use href="#circleRig"></use>

    <!-- drag handle: ONLY this dot is draggable -->
    <circle id="handle" cx="0" cy="0" r="6"
            fill="#111" opacity="0.35"
            style="cursor:grab; touch-action:none;"/>
  </g>

</svg>

<script>
(() => {
  const svg = document.getElementById("svg");
  const active = document.getElementById("active");
  const handle = document.getElementById("handle");
  const landingDots = document.getElementById("landingDots");
  const stamps = document.getElementById("stamps");
  const undoBtn = document.getElementById("undoBtn");
  const clearBtn = document.getElementById("clearBtn");

  // Your sacred distances: Fibonacci squares * 10 units per square
  const radii = [10,20,30,50,80,130,210];

  // 29 sacred points: (0,0) + axis points at ±r
  const points = [{x:0,y:0}];
  for (const r of radii){
    points.push({x:r,y:0},{x:-r,y:0},{x:0,y:r},{x:0,y:-r});
  }

  // draw subtle landing dots
  // (slightly larger for the center)
  for (const p of points){
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", p.x);
    c.setAttribute("cy", p.y);
    c.setAttribute("r", (p.x===0 && p.y===0) ? 2.2 : 1.7);
    landingDots.appendChild(c);
  }

  // helpers
  const svgPoint = (clientX, clientY) => {
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const m = svg.getScreenCTM().inverse();
    return pt.matrixTransform(m);
  };

  const setActivePos = (x,y) => {
    active.setAttribute("transform", `translate(${x} ${y})`);
    active.dataset.x = x;
    active.dataset.y = y;
  };

  const getActivePos = () => ({
    x: parseFloat(active.dataset.x || "0"),
    y: parseFloat(active.dataset.y || "0")
  });

  const nearestSacred = (x,y) => {
    let best = points[0];
    let bestD2 = Infinity;
    for (const p of points){
      const dx = x - p.x, dy = y - p.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < bestD2){ bestD2 = d2; best = p; }
    }
    return {p: best, d2: bestD2};
  };

  // drag state
  let dragging = false;
  let startPointer = {x:0,y:0};
  let startPos = {x:0,y:0};

  const SNAP_RADIUS = 18; // tolerance in SVG units (about ~2 grid squares)

  handle.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    dragging = true;
    handle.setPointerCapture(e.pointerId);
    handle.style.cursor = "grabbing";

    const p = svgPoint(e.clientX, e.clientY);
    startPointer = p;
    startPos = getActivePos();
  });

  handle.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    e.preventDefault();
    const p = svgPoint(e.clientX, e.clientY);
    const dx = p.x - startPointer.x;
    const dy = p.y - startPointer.y;
    setActivePos(startPos.x + dx, startPos.y + dy);
  });

  const finishDrag = () => {
    if (!dragging) return;
    dragging = false;
    handle.style.cursor = "grab";

    const pos = getActivePos();
    const {p, d2} = nearestSacred(pos.x, pos.y);

    // snap if close enough, else go back to origin
    if (Math.sqrt(d2) <= SNAP_RADIUS) {
      setActivePos(p.x, p.y);

      // stamp a copy at snapped point (without handle)
      const g = document.createElementNS("http://www.w3.org/2000/svg","g");
      g.setAttribute("transform", `translate(${p.x} ${p.y})`);
      const u = document.createElementNS("http://www.w3.org/2000/svg","use");
      u.setAttribute("href", "#circleRig");
      g.appendChild(u);
      stamps.appendChild(g);

      // spawn fresh draggable rig back at true origin
      setActivePos(0,0);
    } else {
      setActivePos(0,0);
    }
  };

  handle.addEventListener("pointerup", (e) => { e.preventDefault(); finishDrag(); });
  handle.addEventListener("pointercancel", (e) => { e.preventDefault(); finishDrag(); });

  // undo / clear
  const undo = () => {
    const last = stamps.lastElementChild;
    if (last) stamps.removeChild(last);
  };
  const clear = () => { stamps.innerHTML = ""; setActivePos(0,0); };

  undoBtn.addEventListener("click", undo);
  clearBtn.addEventListener("click", clear);

  // optional keyboard: 'u' undo, 'c' clear
  window.addEventListener("keydown", (e) => {
    if (e.key === "u") undo();
    if (e.key === "c") clear();
  });

  // init
  setActivePos(0,0);
})();
</script>

</body>
</html>
